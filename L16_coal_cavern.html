<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emberkeep | Coal Cavern</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Courier New", monospace;
        background: #101716;
        color: #eee5c9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px 36px;
        background: radial-gradient(ellipse at 50% 0%, #293832 0%, #101716 68%);
        text-align: center;
      }

      h1 {
        margin: 0 0 6px;
        color: #f0bf68;
        font-size: clamp(24px, 5vw, 38px);
        letter-spacing: 0;
      }

      p {
        margin: 0 0 18px;
        color: #b7c0ad;
        font-size: 14px;
      }

      main { width: min(960px, 100%); margin: 0 auto; }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 auto;
        border: 3px solid #687466;
        background: #171d1b;
        image-rendering: pixelated;
        box-shadow: 0 18px 54px #0009;
      }

      a { display: inline-block; margin-top: 16px; color: #f0bf68; }
      a:focus-visible { outline: 2px solid #f0bf68; outline-offset: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
    <script src="https://p5play.org/v3/planck.min.js"></script>
    <script src="https://p5play.org/v3/p5play.js"></script>
    <script src="L16_coal_cavern.js" defer></script>
  </head>
  <body>
    <main>
      <h1>EMBERKEEP</h1>
      <p>Carry the last coals through the dungeon. Wake the machines. Find the way out.</p>
      <div id="game"></div>
      <a href="index.html">Back to the homepage</a>
    </main>
  </body>
</html>
